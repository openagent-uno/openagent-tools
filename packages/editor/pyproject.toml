[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-editor"
version = "1.0.0b2"
description = "Independent OpenAgent capability package"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-tool-protocol==1.0.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_editor"]

[project.scripts]
openagent-editor-mcp = "openagent_editor:main"
