[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-mcp-client"
version = "0.1.0b1"
description = "Operation-scoped MCP client with stable error and cancellation semantics"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.27,<2", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_mcp_client"]
