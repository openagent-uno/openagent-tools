[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-filesystem"
version = "1.0.0b2"
description = "Independent OpenAgent capability package"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-tool-protocol==1.0.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_filesystem"]

[project.scripts]
openagent-filesystem-mcp = "openagent_filesystem:main"
