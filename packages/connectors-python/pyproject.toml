[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-connectors"
version = "0.1.15.dev2026103002"
description = "Trusted local Python adapter for the shared OpenAgent connector runner"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-tool-protocol==1.0.0b2.dev2026103002"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_connectors"]
