name: Qualify explicit software browser rendering
on:
  push:
    branches: [codex/browser-software-rendering]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: sidecars/agent-in-chrome/host/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit
        working-directory: sidecars/agent-in-chrome/host
      - run: node --test sidecars/agent-in-chrome/host/browser-rendering.test.mjs
      - name: Acquire exact official Chromium bytes for the native boundary test
        run: |
          curl --fail --location --retry 2 --max-time 300 https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/mac-arm64/chrome-headless-shell-mac-arm64.zip -o "$RUNNER_TEMP/chrome.zip"
          echo 'b3e093c06001c41e68decbc8dd4a62f9efe4bf4e4dd247a686ea531863448d75  '"$RUNNER_TEMP/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/chrome"
      - name: Real software DOM and screenshot under inherited native confinement
        run: python scripts/qualify_browser_software.py --binary "$RUNNER_TEMP/chrome/chrome-headless-shell-mac-arm64/chrome-headless-shell"
