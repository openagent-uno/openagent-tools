name: Qualify explicit software browser rendering
on:
  push:
    branches: [codex/browser-software-rendering]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.14
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/device-wheel"
        working-directory: packages/device-tools
      - name: Record the exact clean source and qualified wheel
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'device-wheel'
          if subprocess.check_output(['git','status','--porcelain'],text=True).strip():raise ValueError('Clean source required')
          wheel=root/'openagent_device_tools-1.0.0b16-py3-none-any.whl'
          checksum=hashlib.sha256(wheel.read_bytes()).hexdigest()
          (root/'SHA256SUMS').write_text(checksum+'  '+wheel.name+'\n')
          (root/'qualification.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
              'version':'1.0.0b16','wheel_sha256':checksum,'bytes':wheel.stat().st_size,'dirty_snapshot':False,
              'scope':'Actual Mac ARM software DOM and screenshot in inherited sandbox; outside sentinel denied; private CDP pipe; not a signed application release'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Device-Tools-1.0.0b16
          path: ${{ runner.temp }}/device-wheel/*
          retention-days: 3
          if-no-files-found: error
  browser:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: sidecars/agent-in-chrome/host/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit
        working-directory: sidecars/agent-in-chrome/host
      - run: node --test sidecars/agent-in-chrome/host/browser-rendering.test.mjs
      - name: Acquire exact official Chromium bytes for the native boundary test
        run: |
          curl --fail --location --retry 2 --max-time 300 https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/mac-arm64/chrome-headless-shell-mac-arm64.zip -o "$RUNNER_TEMP/chrome.zip"
          echo 'b3e093c06001c41e68decbc8dd4a62f9efe4bf4e4dd247a686ea531863448d75  '"$RUNNER_TEMP/chrome.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/chrome.zip" "$RUNNER_TEMP/chrome"
      - name: Real software DOM and screenshot under inherited native confinement
        run: python scripts/qualify_browser_software.py --binary "$RUNNER_TEMP/chrome/chrome-headless-shell-mac-arm64/chrome-headless-shell"
