name: Qualify shared connectors

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed immutable full source commit (no branch/tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shared-connectors-qualification
  cancel-in-progress: false

jobs:
  qualify:
    # One standard hosted machine; every build/test runs sequentially.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
      GOFLAGS: -p=1
      GOTOOLCHAIN: go1.26.9
      GOWORK: 'off'
      UV_CONCURRENT_BUILDS: '1'
      UV_CONCURRENT_DOWNLOADS: '4'
      UV_CONCURRENT_INSTALLS: '2'
      PAYLOAD_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: executor
          persist-credentials: false
      - name: Validate immutable input
        run: |
          python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["PAYLOAD_SOURCE"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: payload
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install bounded build frontend
        run: python -m pip install uv==0.10.4
      - name: Build and qualify without publication
        run: nice -n 10 python executor/scripts/qualify_connectors_remote.py --source payload --output staging
      - name: Preserve staging and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connectors-qualification-${{ inputs.source_sha }}
          path: staging/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
