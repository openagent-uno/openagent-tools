[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-mcp-example"           # rename to match your skill id
version = "0.2.0"
description = "OpenAgent MCP skill — my-skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27",
    # Add your skill-specific deps here
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
# Entry-point used by the Dockerfile CMD
openagent-mcp-example = "openagent_mcp_example.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_mcp_example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
