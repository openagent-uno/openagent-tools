[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-mcp-my-skill"           # rename to match your skill id
version = "0.1.0"
description = "OpenAgent MCP skill — my-skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core MCP + OpenAgent SDK
    "mcp>=1.3,<2",
    "openagent-sdk>=0.1,<1",          # provides @mcp_tool, db helpers, vault helpers
    "httpx>=0.27",
    # Add your skill-specific deps here
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
# Entry-point used by the Dockerfile CMD
my-skill = "virgil_skill_my_skill.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/virgil_skill_my_skill"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
